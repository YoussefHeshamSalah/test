name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.c"
    #   - "src/**/*.h"

# Cancel an in-progress review when new commits are pushed to the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Self-hosted runner: never run on PRs from forks, and skip drafts
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false

    runs-on: self-hosted
    timeout-minutes: 30

    # github_token below uses this job's GITHUB_TOKEN, so it needs write access to post the review
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          
          # Posts as github-actions[bot]; skips the Claude App token exchange and its workflow validation
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Windows runner: use the pre-installed Claude Code (runner account: twi.test1)
          path_to_claude_code_executable: "C:/Users/YoussefHesham/.local/bin/claude.exe"
          # path_to_bun_executable: "C:/Users/YoussefHesham/.bun/bin/bun.exe"
          
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          claude_args: |
            --append-system-prompt "When the code review is finished, return its final results in the structured output. Set skipped to true if the review stopped early (closed, draft, trivial, or already reviewed PR). Put the overall result in summary. Add one entry to comments for each issue in the final filtered list, with path (file path as in the diff), line (line number in the new version of the file, within the diff) and body (the issue description and suggested fix). Never post comments to GitHub yourself."
            --json-schema '{"type":"object","properties":{"skipped":{"type":"boolean"},"summary":{"type":"string"},"comments":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}},"required":["path","line","body"]}}},"required":["skipped","summary","comments"]}'
            --allowedTools "Read,Grep,Glob,Task,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch,mcp__github_inline_comment__create_inline_comment,Bash(git push:*),Bash(gh api:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh repo:*)"

          # Set to true temporarily to debug a failed run (the log can include repository content)
          show_full_output: true

      # Step 2: a fixed script (not Claude) posts all findings as ONE review
      - name: Post review
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_JSON: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REVIEW_JSON)) {
            Write-Error "Claude returned no structured output."
            exit 1
          }
          $r = $env:REVIEW_JSON | ConvertFrom-Json
          if ($r.skipped -eq $true) {
            Write-Host "Review skipped by the plugin: $($r.summary)"
            exit 0
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $file = Join-Path $env:RUNNER_TEMP "review.json"
          $url  = "repos/$env:REPO/pulls/$env:PR/reviews"

          $comments = @($r.comments | Where-Object { $_ } | ForEach-Object {
            @{ path = $_.path; line = [int]$_.line; side = "RIGHT"; body = $_.body }
          })

          $review = @{ event = "COMMENT"; body = "## Claude code review`n`n$($r.summary)" }
          if ($comments.Count -gt 0) { $review.comments = $comments }

          [System.IO.File]::WriteAllText($file, ($review | ConvertTo-Json -Depth 6), $utf8)
          gh api --method POST $url --input $file
          if ($LASTEXITCODE -eq 0) { exit 0 }

          # Fallback: a line was outside the diff, so post everything in the review body instead
          Write-Warning "Inline review failed; posting findings in the review body instead."
          $list = ($comments | ForEach-Object { "- **$($_.path):$($_.line)**: $($_.body)" }) -join "`n`n"
          $fallback = @{ event = "COMMENT"; body = "## Claude code review`n`n$($r.summary)`n`n$list" }
          [System.IO.File]::WriteAllText($file, ($fallback | ConvertTo-Json -Depth 6), $utf8)
          gh api --method POST $url --input $file
          if ($LASTEXITCODE -ne 0) { exit 1 }
