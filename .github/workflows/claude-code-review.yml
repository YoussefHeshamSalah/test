name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # Runs on every push (synchronize). The code-review plugin skips PRs it has
    # already reviewed, so later pushes usually end early; remove "synchronize"
    # to save those runs.
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.c"
    #   - "src/**/*.h"

# Nothing is granted by default; the job below asks for the minimum it needs.
permissions: {}

jobs:
  claude-review:
    # Self-hosted runner + secrets: same-repo branches only, trusted authors only,
    # no drafts, no Dependabot (it gets no Actions secrets, so the run would fail).
    # CONTRIBUTOR is allowed because org members with private membership show up as it.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)

    runs-on: self-hosted
    timeout-minutes: 30

    # Job-level, so a skipped run (e.g. a draft) never cancels a review in progress
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    # contents: read for the checkout; pull-requests: write to post the review;
    # issues: read so the plugin's gh issue view/list context lookups work.
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout PR head (read-only, never executed)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Automatic per-job token: posts as github-actions[bot], limited by the
          # permissions above, and skips the Claude App token exchange and its
          # workflow validation
          github_token: ${{ github.token }}

          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Claude Code on the runner. The default is currently in YoussefHesham's
          # profile; once a dedicated runner service account exists, install it there
          # and set the repo variable CLAUDE_CODE_EXECUTABLE to that path.
          path_to_claude_code_executable: ${{ vars.CLAUDE_CODE_EXECUTABLE || 'C:/Users/YoussefHesham/.local/bin/claude.exe' }}

          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          # Reads are limited to the checkout. .git/ is blocked because the action
          # writes a GitHub token into .git/config. Credential files in the runner
          # profile are blocked as a second line of defence.
          claude_args: |
            --allowedTools "Read(./**),Grep,Glob,Task,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Read(./.git/**),Read(~/.claude/.credentials.json),Read(~/.claude.json),Read(~/.ssh/**),Read(~/.config/gh/**),Read(~/.git-credentials),Read(~/.gitconfig),Read(~/AppData/Roaming/**),Edit,Write,NotebookEdit,WebFetch,WebSearch,Bash(git push:*),Bash(gh auth:*),Bash(gh api:*),Bash(gh pr review:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh repo:*)"

          show_full_output: true

