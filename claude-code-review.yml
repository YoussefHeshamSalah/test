name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.c"
    #   - "src/**/*.h"

# Cancel an in-progress review when new commits are pushed to the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Self-hosted runner: never run on PRs from forks, and skip drafts
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false

    runs-on: TWI_ORG_RUNNER_2_CSONAR
    timeout-minutes: 30

    # github_token below uses this job's GITHUB_TOKEN, so it needs write access to post the review
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Posts as github-actions[bot]; skips the Claude App token exchange and its workflow validation
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Windows runner: use the pre-installed Claude Code (runner account: twi.test1)
          path_to_claude_code_executable: "C:/Users/twi.test1.THIRDWAYV/.local/bin/claude.exe"

          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          # DEBUG: shows Claude's full output (including errors) in the job log.
          # Set to false once the workflow works, since the log can include repository content.
          show_full_output: true

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Show Claude execution log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "claude-execution-output.json"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No execution log found at $log" }
